name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Detect compatibility/validation changes in upstream
  # Home Assistant tooling even when your repository hasn't changed
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
